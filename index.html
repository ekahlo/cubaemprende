<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Bootstrap + Vite</title>
</head>
<body class="bg-light">

    <!-- Contenedor principal de Bootstrap -->
    <div class="container mt-5 text-center">
        <div class="card shadow p-4 mx-auto" style="max-width: 500px;">
            <h1 class="text-primary mb-3">¡Bootstrap funciona! 🚀</h1>
            <p class="text-muted">Si ves este texto centrado, con una tarjeta blanca, fondo gris y este botón azul, la configuración fue un éxito.</p>
            
            <!-- Botón de prueba para el JavaScript de Bootstrap -->
            <button class="btn btn-primary" data-bs-toggle="tooltip" data-bs-placement="top" title="¡Funciona!">
                Pasa el mouse aquí
            </button>
        </div>
    </div>

    <!-- Enlace al archivo JavaScript principal que configuramos antes -->
    <script type="module" src="/src/js/main.js"></script>

</html>
